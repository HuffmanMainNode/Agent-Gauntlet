name: Agent Gauntlet CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run test suite
        run: python -m pytest -q
      - name: Run deterministic demo
        run: |
          python -m gauntlet run --challenge repository-reality-check --agent demo-good
          python -m gauntlet verify --bundle artifacts/LATEST

      - name: Run and verify 25-seed reference baseline
        if: matrix.python-version == '3.11'
        run: |
          python -m gauntlet reference --output artifacts/reference
          python -m gauntlet verify-reference --baseline artifacts/reference/reference-baseline.json
      - name: Upload deterministic reference baseline
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: agent-gauntlet-reference-baseline
          path: artifacts/reference/
          if-no-files-found: error
          retention-days: 90
